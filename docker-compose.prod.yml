services:
  nginx:
    volumes:
      - ./nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    command: gunicorn mysite.wsgi:application --bind 0.0.0.0:8000
    restart: always